<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Miscellaneous | The Yes Yes Box</title>
    <style>
      body {
        background-color: #f0f0f0; /* Light grey background */
        color: #000;
        font-family: 'Arial Black', Gadget, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      h2 {
        font-size: 3rem;
        text-transform: uppercase;
        border-bottom: 12px solid #000;
        margin: 20px 0 40px 0;
        padding-bottom: 5px;
      }

      /* Mondrian Grid Container */
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px; /* Black line effect */
        background-color: #000;
        padding: 15px;
        border: 15px solid #000;
        max-width: 900px;
        width: 100%;
      }

      /* Section Blocks */
      .block {
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .block h1 {
        margin-top: 0;
        text-transform: uppercase;
        font-size: 1.5rem;
      }

      /* Specific Block Styling */
      .about-blank { 
        grid-column: span 2; 
        background-color: #ff0000; /* Red */
        color: #fff; 
      }
      
      .tab-cloaker { 
        grid-row: span 2; 
        background-color: #ffffff; /* White */
        color: #000; 
      }
      
      .ads-consent { 
        background-color: #0000ff; /* Blue */
        color: #fff; 
      }

      .nav-block {
        background-color: #ffff00; /* Yellow */
        color: #000;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Input and Button Styling */
      input[type="url"], input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 4px solid #000;
        font-family: sans-serif;
        font-weight: bold;
        box-sizing: border-box;
        margin-top: 10px;
      }

      .mondrian-btn {
        cursor: pointer;
        background-color: #ffff00;
        border: 4px solid #000;
        color: #000;
        padding: 10px 15px;
        font-weight: 900;
        text-transform: uppercase;
        margin-top: 10px;
        transition: transform 0.1s;
      }

      .mondrian-btn:active {
        transform: scale(0.95);
      }

      .home-link {
        text-decoration: none;
        color: #000;
        font-size: 1.2rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      /* Mobile adjustment */
      @media (max-width: 700px) {
        .settings-grid { grid-template-columns: 1fr; }
        .about-blank { grid-column: span 1; }
      }
    </style>
  </head>
  <body>
    <h2>Miscellaneous</h2>

    <div class="settings-grid">
      <div class="block about-blank">
        <h1>about:blank</h1>
        <p>Open a URL in a private frame:</p>
        <input id="url-target" type="url" placeholder="https://..." />
        <button id="create" class="mondrian-btn">Create Page</button>
      </div>

      <div class="block tab-cloaker">
        <h1>Tab Cloaker</h1>
        <p>Set a new title or icon URL for the site.</p>
        <input id="userinput" type="text" placeholder="Title or Image URL" />
        <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
          <button onclick="changeTabTitle();" class="mondrian-btn">Set Title</button>
          <button onclick="changeTabIcon();" class="mondrian-btn" style="background-color: #ff0000; color: #fff;">Set Icon</button>
          <button onclick="resetTabSettings();" class="mondrian-btn" style="background-color: #0000ff; color: #fff;">Reset</button>
        </div>
        <p id="console-output"></p>
      </div>

      <div class="block ads-consent">
        <h1>Ads</h1>
        <label style="display: block; margin-bottom: 10px;">
          <input type="checkbox" id="adConsent" name="adConsent"> Disable Ads
        </label>
        <p style="font-size: 0.8rem;">Disabling supports the creator less but improves performance.</p>
      </div>

      <a href="/index.html" class="block nav-block home-link">
        Back to Homepage
      </a>
    </div>

    <script src="/js/misc.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
