<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Projects | The Yes Yes Box</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background-color: #000; /* White/Grey background for high contrast */
        color: #f0f0f0;
        font-family: 'Arial Black', sans-serif; /* Bold, blocky font */
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      h1 {
        font-size: 4rem;
        text-transform: uppercase;
        border-bottom: 10px solid black;
        display: inline-block;
        margin-bottom: 30px;
      }

      /* Mondrian Grid Styling */
      #game-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        grid-auto-rows: 200px;
        gap: 15px; /* Black "lines" effect */
        background-color: #f0f0f0; /* Grid lines */
        padding: 15px;
        border: 15px solid #f0f0f0;
        max-width: 1200px;
        margin: 0 auto;
      }

      .game-link {
        text-decoration: none;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease;
      }

      /* Randomly sizing tiles for asymmetry */
      .game-link:nth-child(3n) { grid-column: span 2; }
      .game-link:nth-child(5n) { grid-row: span 2; }

      .game-tile {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px;
        box-sizing: border-box;
      }

      /* Color Palette from Image */
      .bg-red { background-color: #ff0000; color: white; }
      .bg-blue { background-color: #0000ff; color: white; }
      .bg-yellow { background-color: #ffff00; color: black; }
      .bg-white { background-color: #ffffff; color: black; }

      .game-icon {
        width: 60%;
        height: auto;
        border: 4px solid black;
        background: white;
        margin-bottom: 10px;
      }

      .game-title {
        font-weight: 900;
        font-size: 1.2rem;
        text-transform: uppercase;
        margin: 0;
      }

      .game-link:hover {
        transform: scale(0.98);
        filter: brightness(1.1);
      }

      #search {
        width: 100%;
        max-width: 500px;
        padding: 15px;
        border: 5px solid black;
        font-size: 1.2rem;
        margin-bottom: 20px;
        outline: none;
      }

      /* Back button styling */
      .nav-btn {
        background-color: #ffff00;
        border: 5px solid black;
        color: black;
        padding: 15px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 30px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>

    <h1>Products</h1>
    
    <div>
        <input type="text" id="search" onkeyup="searchGames()" placeholder="SEARCH GAMES..." />
    </div>

    <div id="loader" style="border: 10px solid #000; border-top: 10px solid #ff0000; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 20px auto;"></div>

    <div id="game-container"></div>

    <a href="/index.html">
        <button class="nav-btn">Back to Home</button>
    </a>

    <script>
      let games = [];
      const colors = ['bg-red', 'bg-blue', 'bg-yellow', 'bg-white'];

      function renderGames(data) {
        const container = document.getElementById("game-container");
        container.innerHTML = "";
        data.forEach((project, index) => {
          const colorClass = colors[index % colors.length];
          const game = document.createElement("a");
          game.href = project.link;
          game.className = "game-link";
          game.innerHTML = `
            <div class="game-tile ${colorClass}">
              <img class="game-icon" src="${project.imgSrc}" alt="icon" loading="lazy" />
              <p class="game-title">${project.title}</p>
            </div>`;
          container.appendChild(game);
        });
      }

      fetch("config/games.json")
        .then(res => res.json())
        .then(data => {
          games = data;
          renderGames(games);
          document.getElementById("loader").style.display = "none";
        })
        .catch(err => console.error(err));

      function searchGames() {
        const filter = document.getElementById("search").value.toUpperCase();
        const filtered = games.filter(g => g.title.toUpperCase().includes(filter));
        renderGames(filtered);
      }
    </script>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </body>
</html>
