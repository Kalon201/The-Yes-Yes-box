<!DOCTYPE html>
<html lang="en-US">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="Welcome to The Yes Yes Box, an game site." />
    <meta property="og:description" content="Welcome to The Yes Yes Box, an game site." />
    <meta name="description" content="Welcome to The Yes Yes Box, an game site." />
    <meta name="author" content="Bubber" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Yes Yes Box</title>
    <style>
        body {
            background-color: #f0f0f0; /* Light grey background */
            color: #000;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-bottom: 12px solid #000;
            padding-bottom: 5px;
        }

        #subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* The Mondrian Grid Container */
        .button-grid {
            display: grid;
            /* 3 columns to allow for asymmetrical widths */
            grid-template-columns: 1fr 0.5fr 1fr;
            grid-auto-rows: 180px;
            gap: 15px; /* Black "line" spacing */
            max-width: 800px;
            width: 100%;
            background-color: #000; /* This creates the black lines between blocks */
            padding: 15px;
            border: 15px solid #000;
        }

        /* Base Tile Styling */
        .nav-button {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
            padding: 20px;
            transition: opacity 0.2s;
        }

        .nav-button:hover {
            opacity: 0.8;
        }

        /* Grid Spanning & Colors based on image style */
        .play-btn { 
            grid-column: span 2; 
            grid-row: span 2; 
            background-color: #ff0000; /* Red */
            color: #fff;
        }

        .tools-btn { 
            background-color: #ffff00; /* Yellow */
            color: #000;
        }

        .prox-btn { 
            grid-column: span 1; 
            background-color: #0000ff; /* Blue */
            color: #fff;
        }

        .file-btn { 
            grid-column: span 2; 
            background-color: #ffffff; /* White */
            color: #000;
        }

        .icon-placeholder {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            color: #444;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Mobile adjustment */
        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 150px;
            }
            .play-btn, .prox-btn, .file-btn {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>

    <h1>The Yes Yes Box</h1>
    <span id="subtitle">...</span>

    <div class="button-grid">
        <a href="/projects" class="nav-button play-btn">
            <div class="icon-placeholder">🎮</div>
            Start Playing!
        </a>
        
        <a href="/misc" class="nav-button tools-btn">
            <div class="icon-placeholder">⚙️</div>
            Tools
        </a>
        
        <a href="/tyyp" class="nav-button prox-btn">
            <div class="icon-placeholder">🌐</div>
            Proxy
        </a>
        
        <a href="https://drive.google.com/uc?export=download&id=1i1Mlf0alZUNN628YF_RJMZv7xL4CmC_M" class="nav-button file-btn">
            <div class="icon-placeholder">📂</div>
            Download File
        </a>
    </div>

    <footer>
        &copy; KalonProjects, 2025. All rights reserved. Credit to 3kh0.
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/subtitle.js"></script>
</body>
</html>
