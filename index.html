<!DOCTYPE html>
<html lang="en-US">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="Welcome to The Yes Yes Box, an game site." />
    <meta property="og:description" content="Welcome to The Yes Yes Box, an game site." />
    <meta name="description" content="Welcome to The Yes Yes Box, an game site." />
    <meta name="author" content="Bubber" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Yes Yes Box</title>
    <style>
        body {
            background-color: #1a1a1a; /* Darker background like the image */
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f7f00c; /* Yellow accent for title */
        }

        #subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cccccc;
        }

        /* The Grid Container */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two columns */
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }

        /* Styling each square button */
        .nav-button {
            background-color: #f7f00c;
            color: #000;
            text-decoration: none;
            height: 180px; /* Square height */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 8px 0 #b3ad00; /* 3D effect */
            padding: 20px;
        }

        .nav-button:hover {
            transform: translateY(-5px);
            background-color: #fffb1f;
        }

        .nav-button:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #b3ad00;
        }

        .icon-placeholder {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            color: #888;
            font-size: 0.9rem;
        }

        /* Mobile adjustment: stack buttons if screen is small */
        @media (max-width: 500px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>The Yes Yes Box</h1>
    <span id="subtitle">...</span>

    <div class="button-grid">
        <a href="/projects" class="nav-button">
            <div class="icon-placeholder">🎮</div>
            Start Playing!
        </a>
        
        <a href="/misc" class="nav-button">
            <div class="icon-placeholder">⚙️</div>
            Tools & Settings
        </a>
        
        <a href="/tyyp" class="nav-button">
            <div class="icon-placeholder">🌐</div>
            TheYesYesProx
        </a>
        
        <a href="https://drive.google.com/uc?export=download&id=1GSLQ3fmsetOdhcd84NEdpHU7drfABtVR" class="nav-button">
            <div class="icon-placeholder">📂</div>
            Download File
        </a>
    </div>

    <footer>
        &copy; KalonProjects, 2025. All rights reserved. Credit to 3kh0.
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/subtitle.js"></script>
</body>
</html>
